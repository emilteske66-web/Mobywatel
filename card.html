<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>mObywatel - mDowód</title>
    <link href="https://i.imgur.com/U7TRg0V.png" rel="icon" type="image/x-icon">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f3f6;
            margin: 0;
            padding: 0;
            color: #111;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #ffffff;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #e5e5ea;
        }
        .header-bar img {
            height: 20px;
            cursor: pointer;
        }
        .header-title {
            cursor: pointer;
            user-select: none;
        }
        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        .photo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .photo-container img {
            width: 140px;
            height: 175px;
            object-fit: cover;
            border-radius: 12px;
        }
        .field {
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f5;
            padding-bottom: 10px;
        }
        .label {
            font-size: 12px;
            color: #6e6e73;
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        .value {
            font-size: 16px;
            font-weight: 600;
            color: #1c1c1e;
        }
        .status-box {
            display: flex;
            align-items: center;
            background: #eafbe7;
            color: #1b7a2d;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status-box img {
            width: 20px;
            margin-right: 10px;
        }
        /* Styl ukrytego panelu edycji */
        #edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .modal-content button {
            width: 100%;
            padding: 10px;
            background: #0055ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 8px;">
            <img src="https://i.imgur.com/aXIO2NG.png" alt="Wróć">
            <span>Wróć</span>
        </div>
        <!-- Kliknięcie w napisz mDowód otwiera ukryte menu edycji -->
        <span class="header-title" onclick="openEditModal()" title="Kliknij, aby edytować dane">mDowód</span>
        <img src="https://i.imgur.com/VHNv1TC.png" alt="Menu">
    </div>

    <div class="container">
        <div class="status-box">
            <img src="https://i.imgur.com/bdx9fzT.png" alt="Check">
            <span>Dokument ważny</span>
        </div>

        <div class="card-box">
            <div class="photo-container">
                <img id="user-image" src="" alt="Zdjęcie">
            </div>

            <div class="field">
                <div class="label">Imię (imiona)</div>
                <div class="value" id="val-name">-</div>
            </div>
            <div class="field">
                <div class="label">Nazwisko</div>
                <div class="value" id="val-surname">-</div>
            </div>
            <div class="field">
                <div class="label">Obywatelstwo</div>
                <div class="value" id="val-nationality">-</div>
            </div>
            <div class="field">
                <div class="label">Data urodzenia</div>
                <div class="value" id="val-birthday">-</div>
            </div>
            <div class="field">
                <div class="label">Numer PESEL</div>
                <div class="value" id="val-pesel">-</div>
            </div>
            <div class="field">
                <div class="label">Seria i numer dowodu</div>
                <div class="value" id="val-mdow_series">-</div>
            </div>
            <div class="field">
                <div class="label">Ważny do</div>
                <div class="value" id="val-expiry_date">-</div>
            </div>
            <div class="field">
                <div class="label">Imię ojca</div>
                <div class="value" id="val-father_name">-</div>
            </div>
            <div class="field">
                <div class="label">Imię matki</div>
                <div class="value" id="val-mother_name">-</div>
            </div>
            <div class="field">
                <div class="label">Miejsce urodzenia</div>
                <div class="value" id="val-birthPlace">-</div>
            </div>
            <div class="field">
                <div class="label">Adres zameldowania</div>
                <div class="value" id="val-address">-</div>
            </div>
        </div>
    </div>

    <!-- Ukryte okno edycji danych -->
    <div id="edit-modal">
        <div class="modal-content">
            <h3>Edytuj dane dokumentu</h3>
            <label>Link do zdjęcia:</label>
            <input type="text" id="edit-image">
            <label>Imię:</label>
            <input type="text" id="edit-name">
            <label>Nazwisko:</label>
            <input type="text" id="edit-surname">
            <label>PESEL:</label>
            <input type="text" id="edit-pesel">
            <label>Seria i numer dowodu:</label>
            <input type="text" id="edit-mdow_series">
            <label>Data urodzenia:</label>
            <input type="text" id="edit-birthday">
            <label>Ważny do:</label>
            <input type="text" id="edit-expiry_date">
            <label>Imię ojca:</label>
            <input type="text" id="edit-father_name">
            <label>Imię matki:</label>
            <input type="text" id="edit-mother_name">
            <label>Miejsce urodzenia:</label>
            <input type="text" id="edit-birthPlace">
            <label>Adres (np. Lwowska 5a, Rzeszów):</label>
            <input type="text" id="edit-address">
            
            <button onclick="saveChanges()">Zapisz zmiany</button>
            <button onclick="closeEditModal()" style="background: #ccc; color: #333; margin-top: 5px;">Zamknij</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        function getData(paramName, defaultVal) {
            // Sprawdza czy dane są w pamięci przeglądarki, potem w URL, a jak nie to domyślne
            if (localStorage.getItem(paramName) !== null) {
                return localStorage.getItem(paramName);
            }
            const val = params.get(paramName);
            if (val) {
                return decodeURIComponent(val.replace(/\+/g, ' '));
            }
            return defaultVal;
        }

        function loadData() {
            document.getElementById('val-name').innerText = getData('name', 'Patryk');
            document.getElementById('val-surname').innerText = getData('surname', 'Wiśniewski');
            document.getElementById('val-nationality').innerText = getData('nationality', 'POLSKIE');
            document.getElementById('val-birthday').innerText = getData('birthday', '10.02.2008');
            document.getElementById('val-pesel').innerText = getData('pesel', '08221002957');
            document.getElementById('val-mdow_series').innerText = getData('mdow_series', 'MWYC 24842');
            document.getElementById('val-expiry_date').innerText = getData('expiry_date', '11.02.2031');
            document.getElementById('val-father_name').innerText = getData('father_name', 'Szymon');
            document.getElementById('val-mother_name').innerText = getData('mother_name', 'Danuta');
            document.getElementById('val-birthPlace').innerText = getData('birthPlace', 'Rzeszów');
            
            const fullAddress = getData('address', 'Lwowska 5a, 35-630 Rzeszów');
            document.getElementById('val-address').innerText = fullAddress;

            const imageUrl = getData('image', 'http://res.cloudinary.com/vq9xppsn/image/upload/v1794320480/fuhbh3gvp0odjxhoskrt.png');
            document.getElementById('user-image').src = imageUrl;
        }

        function openEditModal() {
            document.getElementById('edit-name').value = document.getElementById('val-name').innerText;
            document.getElementById('edit-surname').value = document.getElementById('val-surname').innerText;
            document.getElementById('edit-pesel').value = document.getElementById('val-pesel').innerText;
            document.getElementById('edit-mdow_series').value = document.getElementById('val-mdow_series').innerText;
            document.getElementById('edit-birthday').value = document.getElementById('val-birthday').innerText;
            document.getElementById('edit-expiry_date').value = document.getElementById('val-expiry_date').innerText;
            document.getElementById('edit-father_name').value = document.getElementById('val-father_name').innerText;
            document.getElementById('edit-mother_name').value = document.getElementById('val-mother_name').innerText;
            document.getElementById('edit-birthPlace').value = document.getElementById('val-birthPlace').innerText;
            document.getElementById('edit-address').value = document.getElementById('val-address').innerText;
            document.getElementById('edit-image').value = document.getElementById('user-image').src;
            
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function saveChanges() {
            localStorage.setItem('name', document.getElementById('edit-name').value);
            localStorage.setItem('surname', document.getElementById('edit-surname').value);
            localStorage.setItem('pesel', document.getElementById('edit-pesel').value);
            localStorage.setItem('mdow_series', document.getElementById('edit-mdow_series').value);
            localStorage.setItem('birthday', document.getElementById('edit-birthday').value);
            localStorage.setItem('expiry_date', document.getElementById('edit-expiry_date').value);
            localStorage.setItem('father_name', document.getElementById('edit-father_name').value);
            localStorage.setItem('mother_name', document.getElementById('edit-mother_name').value);
            localStorage.setItem('birthPlace', document.getElementById('edit-birthPlace').value);
            localStorage.setItem('address', document.getElementById('edit-address').value);
            localStorage.setItem('image', document.getElementById('edit-image').value);

            closeEditModal();
            loadData();
        }

        // Załaduj dane przy starcie
        loadData();
    </script>
</body>
</html>
